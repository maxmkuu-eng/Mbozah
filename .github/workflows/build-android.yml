name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Align CI APK package with registered Android client
        shell: bash
        run: |
          FIREBASE_PACKAGE=$(python3 -c "import json; print(json.load(open('android/app/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")
          python3 - "$FIREBASE_PACKAGE" <<'PY'
          import pathlib, re, sys
          p=pathlib.Path('android/app/build.gradle')
          s=p.read_text()
          package=sys.argv[1]
          s=re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{package}"', s, count=1)
          p.write_text(s)
          PY

      - name: Create CI release signing key
        working-directory: android/app
        run: |
          keytool -genkeypair -v             -keystore release.keystore             -storepass MkuuAiMasterRelease2026             -keypass MkuuAiMasterRelease2026             -alias mkuu_ai_master_key             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Mbozah, OU=Mbozah, O=Mbozah, L=Tanzania, ST=Dar es Salaam, C=TZ"

      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Verify APK is signed
        working-directory: android/app/build/outputs/apk/release
        run: |
          test -f app-release.apk
          jarsigner -verify -verbose -certs app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mbozah-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
