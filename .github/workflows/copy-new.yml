name: Copy New to Mbozah

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mbozah
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout New
        uses: actions/checkout@v4
        with:
          repository: maxmkuu-eng/New
          path: /tmp/new-source
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Copy all files from New
        run: |
          rm -rf /tmp/new-source/.git
          cp -a /tmp/new-source/. .
      - name: Commit and push copy
        run: |
          rm -f .github/workflows/copy-new.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy New to Mbozah" || exit 0
          git push origin HEAD:main
