name: Copy New to Mbozah

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mbozah
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy complete New repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/new-source /tmp/new.tar.gz
          curl -fsSL 'https://github.com/maxmkuu-eng/New/archive/refs/heads/main.tar.gz' -o /tmp/new.tar.gz
          mkdir -p /tmp/new-source
          tar -xzf /tmp/new.tar.gz -C /tmp/new-source --strip-components=1
          rm -rf /tmp/new-source/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/new-source/. .
          rm -f .github/workflows/build-android.yml
          rm -rf /tmp/new-source /tmp/new.tar.gz
      - name: Remove temporary copy workflow
        run: rm -f .github/workflows/copy-new.yml
      - name: Commit and push copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy New to Mbozah"
          git push origin HEAD:main
