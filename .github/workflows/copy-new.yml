name: Copy New to Mbozah

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mbozah
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download every file from New
        shell: bash
        run: |
          set -euo pipefail
          rm -rf new-source
          mkdir -p new-source
          curl -fsSL 'https://api.github.com/repos/maxmkuu-eng/New/git/trees/main?recursive=1' -o /tmp/new-tree.json
          jq -r '.tree[] | select(.type == "blob") | .path' /tmp/new-tree.json > /tmp/new-files.txt
          while IFS= read -r path; do
            mkdir -p "new-source/$(dirname "$path")"
            curl -fsSL "https://raw.githubusercontent.com/maxmkuu-eng/New/main/${path}" -o "new-source/${path}"
          done < /tmp/new-files.txt
          rm -rf .github/workflows/copy-new.yml
          cp -a new-source/. .
          rm -rf new-source
      - name: Commit and push copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy New to Mbozah" || exit 0
          git push origin HEAD:main
